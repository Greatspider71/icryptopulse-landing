<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iCryptoPulse | Sign in</title>
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#060b17;--card:rgba(14,22,42,.72);--line:rgba(120,160,255,.18);--tx:#e8eefc;--mut:#8b9bc2;--a:#22d3ee;--b:#a78bfa;--bad:#fb7185}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 20% 10%,#10204a 0,transparent 60%),radial-gradient(900px 600px at 90% 90%,#2a1458 0,transparent 55%),var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 30px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(34,211,238,.08)}
.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 18px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 30px rgba(34,211,238,.4)}
h1{font-size:24px;text-align:center;margin:0 0 4px;letter-spacing:.2px}
p.s{text-align:center;color:var(--mut);margin:0 0 24px;font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(6,11,23,.7);color:var(--tx);font-size:16px;outline:none;transition:.2s}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:600;color:#04101c;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));transition:.2s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
#msg{min-height:20px;margin-top:12px;font-size:14px;text-align:center;color:var(--bad)}
.tick{display:flex;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.tick b{color:var(--a);font-weight:600}
.fine{margin-top:14px;font-size:11.5px;color:var(--mut);text-align:center}
.fine a{color:var(--mut)}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="card">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#04101c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
  <h1>iCryptoPulse</h1>
  <p class="s">Research lab. Sign in to continue.</p>
  <form id="f" novalidate>
    <label for="e">Registered email</label>
    <input id="e" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
    <button type="submit">Continue</button>
    <div id="msg" role="alert"></div>
  </form>
  <div class="tick"><span>BTC <b>70%</b></span><span>ETH <b>30%</b></span><span>Research only</span></div>
  <p class="fine">Not financial advice. See <a href="terms.html">terms</a> and <a href="disclaimer.html">disclaimer</a>.</p>
</main>
<script>
(function(){
  var OK="54372cc47f40fd68c888c7e185b4bf3ea189b08a953ef0ad6c606f6615070429"; // SHA-256 of the registered email (the address itself is not in the page)
  var c=document.getElementById("bg"),x=c.getContext("2d"),P=[],W,Hh;
  function size(){W=c.width=innerWidth;Hh=c.height=innerHeight;P=[];for(var i=0;i<Math.min(70,W*Hh/18000);i++)P.push({x:Math.random()*W,y:Math.random()*Hh,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4})}
  function draw(){x.clearRect(0,0,W,Hh);P.forEach(function(p,i){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>Hh)p.vy*=-1;
    x.fillStyle="rgba(34,211,238,.7)";x.beginPath();x.arc(p.x,p.y,1.6,0,6.3);x.fill();
    for(var j=i+1;j<P.length;j++){var q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<130){x.strokeStyle="rgba(167,139,250,"+(.25*(1-d/130))+")";x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches)requestAnimationFrame(draw)}
  size();addEventListener("resize",size);draw();
  async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(v){return v.toString(16).padStart(2,"0")}).join("")}
  document.getElementById("f").addEventListener("submit",async function(ev){
    ev.preventDefault();var m=document.getElementById("msg"),v=document.getElementById("e").value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){m.textContent="Enter a valid email address.";return}
    if(!(crypto&&crypto.subtle)){m.textContent="This browser cannot verify sign-in.";return}
    if(await sha(v)===OK){try{sessionStorage.setItem("icp_login","1")}catch(e){}location.href="index.html"}
    else m.textContent="This email is not registered."});
})();
</script></body></html>
